[project]
name = "langchain-demo"
version = "0.1.0"
description = "LangChain learning sandbox with Claude"
readme = "README.md"
authors = [
    { name = "varunk005", email = "varunkm.005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
